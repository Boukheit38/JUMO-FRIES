<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jumo's Fries & Drinks</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f8f8f8;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #e67e22;
}

.menu {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
}

label {
    font-weight: bold;
}

input, select {
    width: 90%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    margin-top: 20px;
    padding: 13px 25px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #218838;
}
</style>
</head>

<body>

<div class="menu">

<h1>🍟 Jumo's Fries & Drinks</h1>

<h2>Place Your Order</h2>

<label>Full Name</label><br>
<input type="text" id="name" placeholder="Enter your name" required>
<br><br>

<label>Phone Number</label><br>
<input type="tel" id="phone" placeholder="Enter your phone number" required>
<br><br>

<label>Delivery Location</label><br>
<input type="text" id="location" placeholder="Enter your location" required>
<br><br>

<label>Select Your Order</label><br>
<select id="order" required>
    <option value="">-- Choose Your Order --</option>
    <option value="Chips" data-price="50">🍟 Chips - KSh 50</option>
    <option value="Smokie" data-price="30">🌭 Smokie - KSh 30 each</option>
    <option value="Soda" data-price="60">🥤 Soda - KSh 60</option>
    <option value="Chicken & Chips" data-price="300">🍗 Chicken & Chips - KSh 300</option>
</select>
<br><br>

<label>Quantity</label><br>
<input type="number" id="quantity" value="1" min="1" required>
<br><br>

<button onclick="placeOrder()">📲 Place Order on WhatsApp</button>

</div>

<script>

function placeOrder() {

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const location = document.getElementById("location").value;

    const orderSelect = document.getElementById("order");
    const order = orderSelect.value;

    const quantity = document.getElementById("quantity").value;

    if (name === "" || phone === "" || location === "" || order === "") {
        alert("Please fill in all the details before placing your order.");
        return;
    }

    const selectedOption = orderSelect.options[orderSelect.selectedIndex];
    const price = Number(selectedOption.getAttribute("data-price"));

    const total = price * Number(quantity);

    const message =
        "🍟 *NEW ORDER - JUMO'S FRIES*%0A%0A" +
        "👤 Name: " + encodeURIComponent(name) + "%0A" +
        "📞 Phone: " + encodeURIComponent(phone) + "%0A" +
        "📍 Location: " + encodeURIComponent(location) + "%0A%0A" +
        "🛒 Order: " + encodeURIComponent(order) + "%0A" +
        "🔢 Quantity: " + quantity + "%0A" +
        "💰 Total: KSh " + total;

    const whatsappNumber = "254716055034";

    const whatsappURL =
        "https://wa.me/" + whatsappNumber + "?text=" + message;

    window.open(whatsappURL, "_blank");
}

</script>

</body>
</html>
